apiVersion: v1
kind: Namespace
metadata:
  name: edip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: edip
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: edip/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: edip-config
        - secretRef:
            name: edip-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: edip
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
