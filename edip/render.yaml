services:
  # ─── 1. FastAPI API Gateway ──────────────────────────────────────────────
  - type: web
    name: edip-api-gateway
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edip-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edip-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      # Note: For the full Enterprise RAG stack, you will need to add
      # external URLs for ChromaDB, Celery, and Elasticsearch via Render Dashboard.

  # ─── 2. Celery Worker (AI & Ingestion) ──────────────────────────────────
  - type: worker
    name: edip-celery-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --queues=ai,embedding,ocr,ingestion
    region: ohio
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edip-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edip-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: edip-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: edip-redis
          property: connectionString

databases:
  # ─── 3. PostgreSQL Database ─────────────────────────────────────────────
  - name: edip-postgres
    region: ohio
    plan: starter
    databaseName: edip_db
    user: edip_user

  # ─── 4. Redis Cache & Message Broker ────────────────────────────────────
  - type: redis
    name: edip-redis
    region: ohio
    plan: starter
    maxmemoryPolicy: allkeys-lru
