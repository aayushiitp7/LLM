# =============================================================================
# Enterprise Document Intelligence Platform — Docker Compose
# Production-grade multi-service orchestration
# =============================================================================
# Usage:
#   cp .env.example .env       # Fill in secrets
#   docker compose up -d       # Start all services
#   docker compose logs -f     # Tail all logs
#   docker compose down -v     # Stop and remove volumes (WARNING: data loss)
# =============================================================================

version: "3.9"

# ─── Named Volumes ────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  chroma_data:
    driver: local
  faiss_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ollama_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────

networks:
  edip-internal:
    driver: bridge
    internal: true        # Services only accessible within the network
  edip-public:
    driver: bridge        # Only gateway, frontend, nginx exposed


# =============================================================================
# ─── Infrastructure Services ─────────────────────────────────────────────────
# =============================================================================

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edip}
      POSTGRES_USER: ${POSTGRES_USER:-edip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:5432:5432"    # Localhost only — not exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edip_user} -d ${POSTGRES_DB:-edip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.7
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_lock_waits=on
        -c log_statement=none
        -c row_security=on

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edip-redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-changeme}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
        --appendfsync everysec
        --tcp-keepalive 60
        --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── RabbitMQ 3 ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: edip-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edip_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-edip}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # Management UI (localhost only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MinIO (S3-compatible Object Storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: edip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init (create default buckets) ────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: edip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - edip-internal
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET_DOCUMENTS:-edip-documents};
        mc mb --ignore-existing local/${MINIO_BUCKET_PROCESSED:-edip-processed};
        mc version enable local/${MINIO_BUCKET_DOCUMENTS:-edip-documents};
        echo 'MinIO buckets initialized';
      "
    restart: on-failure

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    container_name: edip-chroma
    restart: unless-stopped
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch 8 ────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: edip-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false    # Disable for dev; enable in prod
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v red"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Ollama (Local LLM) ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: edip-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 5


# =============================================================================
# ─── Application Services ─────────────────────────────────────────────────────
# =============================================================================

  # ── API Gateway (FastAPI) ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: edip-api-gateway
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - OCR_SERVICE_URL=http://ocr-service:8001
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
      - RETRIEVAL_SERVICE_URL=http://retrieval-service:8003
      - LLM_SERVICE_URL=http://llm-service:8004
      - ANALYTICS_SERVICE_URL=http://analytics-service:8005
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edip-internal
      - edip-public
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      rollback_config:
        parallelism: 0
        failure_action: rollback

  # ── Celery Workers ─────────────────────────────────────────────────────────
  celery-worker-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: edip-celery-ingestion
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
        --loglevel=info
        --queues=ingestion
        --concurrency=4
        --max-tasks-per-child=100
        --without-gossip
        --without-mingle
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - OCR_SERVICE_URL=http://ocr-service:8001
      - EMBEDDING_SERVICE_URL=http://embedding-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edip-internal

  celery-worker-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: edip-celery-ai
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
        --loglevel=info
        --queues=ai,embedding,ocr
        --concurrency=2
        --max-tasks-per-child=50
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edip-internal

  # ── Celery Beat (Scheduled Tasks) ──────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: edip-celery-beat
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - edip-internal

  # ── OCR Microservice ───────────────────────────────────────────────────────
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: edip-ocr-service
    restart: unless-stopped
    environment:
      - OCR_ENGINE=${OCR_ENGINE:-ensemble}
      - OCR_LANG=${OCR_LANG:-en}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-0.7}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - edip-internal
    volumes:
      - ./services/ocr-service:/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ocr/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s   # PaddleOCR model loading takes time

  # ── Embedding Microservice ─────────────────────────────────────────────────
  embedding-service:
    build:
      context: ./services/embedding-service
      dockerfile: Dockerfile
    container_name: edip-embedding-service
    restart: unless-stopped
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - VECTOR_DB=${VECTOR_DB:-chroma}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - REDIS_URL=${REDIS_URL}
    depends_on:
      chroma:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edip-internal
    volumes:
      - faiss_data:/data/faiss_indexes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s   # Model download on first start

  # ── Retrieval Microservice ─────────────────────────────────────────────────
  retrieval-service:
    build:
      context: ./services/retrieval-service
      dockerfile: Dockerfile
    container_name: edip-retrieval-service
    restart: unless-stopped
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - REDIS_URL=${REDIS_URL}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-20}
      - RERANK_TOP_K=${RERANK_TOP_K:-5}
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - edip-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 20s
      timeout: 10s
      retries: 3

  # ── LLM Microservice ───────────────────────────────────────────────────────
  llm-service:
    build:
      context: ./services/llm-service
      dockerfile: Dockerfile
    container_name: edip-llm-service
    restart: unless-stopped
    environment:
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-openai}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.7}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - edip-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 20s
      timeout: 10s
      retries: 3

  # ── Analytics Microservice ─────────────────────────────────────────────────
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: edip-analytics-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - edip-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 20s
      timeout: 10s
      retries: 3

  # ── Frontend (Next.js 14) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-DocIntel Enterprise}
    container_name: edip-frontend
    restart: unless-stopped
    networks:
      - edip-public
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5


# =============================================================================
# ─── Monitoring Stack ──────────────────────────────────────────────────────────
# =============================================================================

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: edip-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:9090:9090"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: edip-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - edip-internal
      - edip-public
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # ── OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: edip-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  # ── Flower (Celery Monitoring) ─────────────────────────────────────────────
  flower:
    image: mher/flower:latest
    container_name: edip-flower
    restart: unless-stopped
    command: >
      celery
        --broker=${CELERY_BROKER_URL}
        flower
        --port=5555
        --basic_auth=admin:${GRAFANA_ADMIN_PASSWORD:-changeme}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - edip-internal
    ports:
      - "127.0.0.1:5555:5555"

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: edip-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for TLS:
      # - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edip-public
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
