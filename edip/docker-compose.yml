version: '3.8'

services:
  # ---------------------------------------
  # Database & Messaging Infrastructure
  # ---------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: edip_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    command: ["--setParameter", "transactionLifetimeLimitSeconds=600"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edip_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # Core Backend APIs
  # ---------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edip_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - edip_uploads:/app/uploads
      - edip_chroma:/app/chroma_db
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URI=redis://redis:6379/0
      - CHROMA_DB_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------
  # Async Worker (OCR & Ingestion)
  # ---------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edip_worker
    command: celery -A app.worker.celery_app worker --loglevel=info -c 2
    volumes:
      - ./backend:/app
      - edip_uploads:/app/uploads
      - edip_chroma:/app/chroma_db
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URI=redis://redis:6379/0
      - CHROMA_DB_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------
  # Frontend Dashboard
  # ---------------------------------------
  frontend:
    image: node:20-alpine
    container_name: edip_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  edip_uploads:
  edip_chroma:
